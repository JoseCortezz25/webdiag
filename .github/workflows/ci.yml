name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Install Chrome for the accessibility probe
        run: bunx puppeteer browsers install chrome

      - name: Test
        run: bun test
        env:
          # GitHub runners cannot always create the user namespace Chrome's
          # sandbox needs. The probe keeps it on everywhere else.
          WEBDIAG_CHROME_NO_SANDBOX: '1'

      - name: Build
        run: bun run build

      - name: Smoke check the built CLI
        run: ./dist/cli.js --help
